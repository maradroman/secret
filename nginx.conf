map $time_iso8601 $case_files_locked {
    default 1;
    ~^2025-10-24T21: 0;
    ~^2025-10-(?:2[5-9]|3[01])T 0;
    ~^2025-(?:11|12)- 0;
    ~^20(?:2[6-9]|[3-9][0-9])- 0;
}

map $uri $canonical_case_path {
    default "";
    ~^/case1\.html$ /case/1f132fgdb/;
    ~^/case/1/?$ /case/1f132fgdb/;
    ~^/case2\.html$ /case/2g542gfd/;
    ~^/case/2/?$ /case/2g542gfd/;
    ~^/case3\.html$ /case/3fdst534g/;
    ~^/case/3/?$ /case/3fdst534g/;
}

map $uri $nested_case_path {
    default "";
    ~^/case/[^/]+/case1\.html$ /case/1f132fgdb/;
    ~^/case/[^/]+/case2\.html$ /case/2g542gfd/;
    ~^/case/[^/]+/case3\.html$ /case/3fdst534g/;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        if ($case_files_locked = 0) {
            return 302 /home/;
        }

        try_files $uri =404;
    }

    location = /home.html {
        if ($case_files_locked = 1) {
            return 404;
        }

        return 301 /home/;
    }

    location ~ ^/(?:case[1-3]\.html|case/[1-3]/?)$ {
        if ($case_files_locked = 1) {
            return 404;
        }

        return 301 $canonical_case_path;
    }

    location ~ ^/case/[^/]+/case[1-3]\.html$ {
        if ($case_files_locked = 1) {
            return 404;
        }

        return 301 $nested_case_path;
    }

    location = /home {
        if ($case_files_locked = 1) {
            return 404;
        }

        return 301 /home/;
    }

    location = /case/1f132fgdb/ {
        if ($case_files_locked = 1) {
            return 404;
        }

        try_files /case1.html =404;
    }

    location = /case/2g542gfd/ {
        if ($case_files_locked = 1) {
            return 404;
        }

        try_files /case2.html =404;
    }

    location = /case/3fdst534g/ {
        if ($case_files_locked = 1) {
            return 404;
        }

        try_files /case3.html =404;
    }

    location = /home/ {
        if ($case_files_locked = 1) {
            return 404;
        }

        try_files /home.html =404;
    }

    location ~* ^/quest(?:-access)?\.js$ {
        if ($case_files_locked = 1) {
            return 404;
        }

        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        try_files $uri =404;
    }

    location = /reveal.ics {
        default_type text/calendar;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }
}
