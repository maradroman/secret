name: hbd-detective-quest

services:
  web:
    build:
      context: .
    image: hbd-detective-quest:local
    init: true
    restart: unless-stopped
    ports:
      - "10042:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
